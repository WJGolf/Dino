<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dino Meme Arcade - Perfect Balance</title>
  <style>
    :root { 
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-neon: #00f5d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ff4757;
    }
    
    * { box-sizing: border-box; padding: 0; margin: 0; font-family: 'Chalkboard SE', 'Segoe UI', Tahoma, sans-serif; }
    
    body { 
      background: var(--bg-color); 
      color: var(--text-main);
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 20px 15px; 
      user-select: none; 
      -webkit-user-select: none; 
      touch-action: pan-y; 
    }

    h1 { font-size: 24px; margin-bottom: 15px; color: var(--accent-neon); text-shadow: 0 0 10px rgba(0, 245, 212, 0.3); text-align: center; }
    
    /* กล่องล็อกอินและเลือกความยาก */
    #setup-zone { 
      background: var(--card-bg); 
      padding: 15px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
      margin-bottom: 15px; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      gap: 12px;
      border: 1px solid #334155;
      width: 100%;
      max-width: 850px;
      transition: all 0.3s ease;
    }
    .input-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; }
    
    #pName, #gameMode { 
      padding: 10px; 
      background: #0f172a;
      border: 2px solid #475569; 
      color: var(--text-main);
      border-radius: 10px; 
      font-weight: bold; 
      font-size: 14px; 
      text-align: center; 
      outline: none; 
    }
    #pName { width: 140px; }
    #gameMode { color: var(--accent-neon); cursor: pointer; }
    #pName:focus, #gameMode:focus { border-color: var(--accent-neon); box-shadow: 0 0 8px rgba(0, 245, 212, 0.5); }
    
    .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; }
    .file-upload-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%; }
    .btn-file { background: #334155; color: var(--text-main); padding: 10px 15px; border-radius: 10px; border: 1px dashed #94a3b8; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
    
    #btn-start-play { 
      padding: 10px 20px; 
      background: var(--accent-neon); 
      color: #0f172a; 
      border: none; 
      border-radius: 10px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 14px; 
    }
    #btn-start-play:disabled { background: #475569; color: var(--text-muted); cursor: not-allowed; }
    
    /* หน้าจอเกม */
    #game-container-wrapper {
      position: relative;
      width: 100%;
      max-width: 850px; 
      background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
      border: 3px solid #334155;
      border-radius: 20px;
      padding: 5px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #game-box { 
      position: relative; 
      width: 100%; 
      height: 250px; 
      border-bottom: 4px dashed var(--text-muted); 
      overflow: hidden; 
      border-radius: 12px;
    }

    /* ตัวผู้เล่น */
    #dino { 
      position: absolute; 
      width: 60px; 
      height: 60px; 
      bottom: 0px; 
      left: 50px; 
      background-image: url('image_3e4e5d.png'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 8px; 
      z-index: 2;
      transform-origin: center;
    }
    
    .dino-running { animation: trollWobble 0.15s infinite alternate; }
    @keyframes trollWobble {
      0% { transform: rotate(-6deg) scaleY(0.95); }
      100% { transform: rotate(6deg) scaleY(1.03); }
    }
    
    #cactus { position: absolute; width: 40px; height: 60px; bottom: 0; left: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; z-index: 2; }
    #game-status { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; }
    #status-text { font-size: 16px; font-weight: bold; color: var(--text-main); margin-bottom: 8px; text-align: center; padding: 0 20px; }
    
    /* POPUP */
    #game-over-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(4px);
    }
    .modal-title { font-size: 28px; color: var(--danger); font-weight: bold; margin-bottom: 5px; }
    .modal-score { font-size: 18px; color: var(--text-main); margin-bottom: 15px; }
    .modal-btn-group { display: flex; flex-direction: column; gap: 10px; width: 80%; }
    .btn-modal { padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .btn-retry { background: var(--accent-neon); color: #0f172a; }
    .btn-quit { background: #475569; color: var(--text-main); }

    /* ปุ่มกระโดดสำหรับมือถือ/ไอแพด */
    #btn-mobile-jump {
      width: 100%;
      max-width: 850px;
      margin-top: 15px;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
      background: var(--accent-neon);
      color: #0f172a;
      border: none;
      border-radius: 15px;
      box-shadow: 0 8px 0 #00b39b;
      cursor: pointer;
      touch-action: manipulation; 
      transition: 0.1s;
    }
    #btn-mobile-jump:active {
      transform: translateY(8px);
      box-shadow: 0 0 0 #00b39b;
    }

    #score-zone { margin-top: 15px; font-size: 24px; font-weight: bold; color: var(--accent-neon); }
    
    /* ตารางคะแนน */
    #leaderboard { width: 100%; max-width: 850px; margin-top: 20px; background: var(--card-bg); border-radius: 16px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid #334155; }
    #lb-title { font-size: 14px; font-weight: bold; color: var(--text-main); margin-bottom: 15px; border-left: 4px solid var(--accent-neon); padding-left: 10px; display: flex; justify-content: space-between; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: var(--text-muted); font-size: 12px; padding-bottom: 10px; border-bottom: 2px solid #334155; }
    td { padding: 8px 0; border-bottom: 1px solid #334155; font-size: 14px; vertical-align: middle; }
    .rank { font-weight: bold; width: 40px; color: var(--text-muted); }
    .top3 { color: #ff9f43; font-size: 16px; }
    .score-val { text-align: right; color: var(--accent-neon); font-weight: bold; }
    
    .player-profile { display: flex; align-items: center; gap: 10px; }
    .player-avatar { width: 35px; height: 35px; border-radius: 8px; object-fit: cover; background: #334155; border: 1px solid #475569; }
  </style>
</head>
<body>

  <h1>🦖 DINO MULTIPLIER ARCADE</h1>

  <div id="setup-zone">
    <div class="input-row">
      <input type="text" id="pName" placeholder="ชื่อนักซิ่ง..." maxlength="12">
      
      <select id="gameMode">
        <option value="1">🔥 โหมด x1 (เร่งความเร็วระดับปกติ)</option>
        <option value="2">⚡ โหมด x2 (เร่งความเร็ว x2)</option>
        <option value="5">💀 โหมด x5 (เร่งความเร็ว x5)</option>
        <option value="10">☣️ โหมด x10 (เร่งความเร็ว x10)</option>
        <option value="15">👹 โหมด x15 (เร่งความเร็ว x15)</option>
        <option value="20">👑 โหมด x20 (เร่งความเร็วระดับนรกแตก)</option>
      </select>

      <div class="file-upload-wrapper">
        <button class="btn-file" id="btn-file-label">📸 ใส่รูปโปรไฟล์</button>
        <input type="file" id="pImage" accept="image/*" onchange="handleImageUpload(event)">
      </div>
    </div>
    <button id="btn-start-play" onclick="confirmName()">ยืนยันข้อมูล</button>
  </div>

  <div id="game-container-wrapper">
    <div id="game-box">
      <div id="game-status">
        <div id="status-text">🔒 ลงชื่อและเลือกโหมดด้านบนก่อนลุย!</div>
      </div>

      <div id="game-over-modal">
        <div class="modal-title">เกมโอเวอร์!</div>
        <div class="modal-score">คะแนน: <span id="modalScoreVal" style="color:var(--accent-neon); font-weight:bold;">0</span></div>
        <div id="modal-sync-text" style="font-size:12px; color:var(--text-muted); margin-bottom:15px;">กำลังอัปเดตชีต...</div>
        <div class="modal-btn-group">
          <button class="btn-modal btn-retry" id="btn-retry-ui">จัดอีกรอบ!</button>
          <button class="btn-modal btn-quit" onclick="quitToNameSetup()">เปลี่ยนชื่อ/โหมด</button>
        </div>
      </div>

      <div id="dino"></div>
      <div id="cactus">🌵</div>
    </div>
  </div>

  <button id="btn-mobile-jump">🚀 JUMP! (กระโดด)</button>

  <div id="score-zone">SCORE: <span id="currentScore">0</span></div>

  <div id="leaderboard">
    <div id="lb-title">
      <span>ทำเนียบคะแนนสูงสุด (Top 50)</span>
      <span id="sync-status" style="font-size:12px; color:var(--text-muted); font-weight:normal;">กำลังโหลดข้อมูล...</span>
    </div>
    <table>
      <thead><tr><th>Rank</th><th>รายชื่อวัยรุ่น</th><th style="text-align:right">Score</th></tr></thead>
      <tbody id="lbBody"></tbody>
    </table>
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzSQ7Q1g6xrYDqsNLo2ff1xTQsJHwEz2FYO6haqBc-bzp7_ARIthG8U6sMaTNAn2kc_VQ/exec";

  let isNameConfirmed = false; 
  let isPlaying = false;
  let isSaving = false;
  let score = 0;
  let gameInterval;
  let cactusPos = 850;
  let confirmedPlayerName = "";
  let playerImageBase64 = ""; 

  // 🟢 จูนระบบสมดุลใหม่: ทุกโหมดสตาร์ทที่ความเร็ว 7.0 เท่าเวอร์ชันแรก
  let currentSpeed = 7.0;       
  let speedIncrement = 0.002;  // อัตราเร่งพื้นฐานดั้งเดิม
  let scoreMultiplier = 1;   

  let dinoY = 0;               
  let dinoVelocityY = 0;       
  const gravity = 0.8;        
  const jumpForce = 13.5;      

  const dino = document.getElementById('dino');
  const cactus = document.getElementById('cactus');
  const pNameInput = document.getElementById('pName');
  const gameModeSelect = document.getElementById('gameMode');
  const btnStart = document.getElementById('btn-start-play');
  const gameStatus = document.getElementById('game-status');
  const statusText = document.getElementById('status-text');
  const syncStatus = document.getElementById('sync-status');
  const gameOverModal = document.getElementById('game-over-modal');
  const mobileJumpBtn = document.getElementById('btn-mobile-jump');
  const retryBtn = document.getElementById('btn-retry-ui');

  window.onload = () => updateLeaderboard();

  window.addEventListener('keydown', e => {
    if(e.code === 'Space') {
      e.preventDefault();
      handleActionInput();
    }
  });

  mobileJumpBtn.addEventListener('mousedown', (e) => { e.preventDefault(); handleActionInput(); });
  mobileJumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleActionInput(); });
  retryBtn.addEventListener('mousedown', (e) => { e.preventDefault(); restartFromModal(); });
  retryBtn.addEventListener('touchstart', (e) => { e.preventDefault(); restartFromModal(); });

  function handleActionInput() {
    if (!isNameConfirmed) return alert("กรุณาใส่ชื่อแล้วกดยืนยันก่อนครับ!");
    if (gameOverModal.style.display === 'flex') {
      if (!isSaving) restartFromModal();
    } else {
      if (!isPlaying && !isSaving) startGame();
      else if (isPlaying) jump();
    }
  }

  function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    document.getElementById('btn-file-label').innerText = "⏳ รอแป๊บ...";

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_SIZE = 80; 
        let width = img.width;
        let height = img.height;
        
        if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
        else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
        
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        playerImageBase64 = canvas.toDataURL('image/jpeg', 0.8);
        document.getElementById('btn-file-label').innerHTML = "✅ รูปพร้อม!";
        document.getElementById('btn-file-label').style.borderColor = "var(--accent-neon)";
        document.getElementById('btn-file-label').style.color = "var(--accent-neon)";
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function confirmName() {
    const name = pNameInput.value.trim();
    if (!name) return alert("ใส่ชื่อก่อนวัยรุ่น!");
    
    scoreMultiplier = Number(gameModeSelect.value);
    
    // 🟢 คำนวณอัตราเร่งความเร็วให้สอดคล้องแบบสมดุล ไม่ยากเร็วจนเกินไปในเฟรมแรกๆ
    if (scoreMultiplier === 1) speedIncrement = 0.002;
    else if (scoreMultiplier === 2) speedIncrement = 0.005;
    else if (scoreMultiplier === 5) speedIncrement = 0.015;
    else if (scoreMultiplier === 10) speedIncrement = 0.035;
    else if (scoreMultiplier === 15) speedIncrement = 0.065;
    else if (scoreMultiplier === 20) speedIncrement = 0.120; // โหมดนรกแตก วิ่งไปแป๊บเดียวไวจัด!

    confirmedPlayerName = name;
    pNameInput.disabled = true;
    gameModeSelect.disabled = true;
    btnStart.disabled = true;
    btnStart.innerText = "กำลังซิงค์...";
    statusText.innerHTML = "กำลังส่งข้อมูลไป Sheet...<br><span style='font-size:13px; color:var(--accent-neon);'>รอสัญญาณตอบกลับ</span>";

    if (playerImageBase64) { dino.style.backgroundImage = `url('${playerImageBase64}')`; }

    const payload = { action: 'register', name: name, image: playerImageBase64 };
    
    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload),
      headers: { "Content-Type": "text/plain;charset=utf-8" } 
    })
    .then(res => res.json())
    .then(response => {
      if (response && response.status === "success") {
        isNameConfirmed = true;
        document.getElementById('setup-zone').style.opacity = "0.5";
        btnStart.innerText = "ลงทะเบียนแล้ว";
        statusText.innerHTML = `ลุยเลย ${confirmedPlayerName}! (โหมด x${scoreMultiplier})<br><span style='font-size:14px; color:var(--accent-neon);'>กดปุ่ม JUMP ด้านล่างเพื่อเริ่มซิ่ง</span>`;
      } else throw new Error("Server Error");
    })
    .catch(err => {
      pNameInput.disabled = false;
      gameModeSelect.disabled = false;
      btnStart.disabled = false;
      btnStart.innerText = "ยืนยันข้อมูล";
      statusText.innerHTML = "<span style='color:var(--danger);'>เชื่อมต่อ Sheet ไม่ได้ ลองใหม่นะ</span>";
    });
  }

  function jump() {
    if (dinoY === 0) { 
      dinoVelocityY = jumpForce; 
      dino.classList.remove('dino-running'); 
    }
  }

  function startGame() {
    isPlaying = true;
    score = 0;
    cactusPos = document.getElementById('game-box').offsetWidth; 
    
    // 🟢 กลับมาใช้ความเร็วเริ่มต้น 7.0 เปิดฉากมาสปีดปกติทันที
    currentSpeed = 7.0; 

    document.getElementById('currentScore').innerText = score;
    gameStatus.style.display = 'none';
    gameOverModal.style.display = 'none';
    dino.classList.add('dino-running');
    dino.style.transform = "rotate(0deg)"; 

    gameInterval = setInterval(() => {
      // คะแนนเพิ่มตามตัวคูณโหมดที่เลือก
      score += scoreMultiplier;
      document.getElementById('currentScore').innerText = score;
      
      // ความเร็วเร่งสะสมเพิ่มจากฐาน 7.0 ขึ้นไปเรื่อยๆ ตามตัวคูณความยาก
      currentSpeed += speedIncrement;

      if (dinoY > 0 || dinoVelocityY > 0) {
        dinoVelocityY -= gravity; 
        dinoY += dinoVelocityY; 
        
        if (dinoY <= 0) { 
          dinoY = 0;
          dinoVelocityY = 0;
          if(isPlaying) dino.classList.add('dino-running'); 
        }
      }
      dino.style.bottom = dinoY + 'px';

      if (dinoY > 0) {
        let angle = -dinoVelocityY * 2.5; 
        dino.style.transform = `rotate(${angle}deg)`;
      } else { dino.style.transform = ""; }

      cactusPos -= currentSpeed;

      if(cactusPos < -40) {
        const obstacles = ['🌵', '🌴', '🧱', '🍄', '💩'];
        cactus.innerText = obstacles[Math.floor(Math.random() * obstacles.length)];
        cactusPos = document.getElementById('game-box').offsetWidth + 50;
      }
      cactus.style.left = cactusPos + 'px';

      // Hitbox
      if (cactusPos > 40 && cactusPos < 100) { 
        if (dinoY < 45) { 
          gameOver(confirmedPlayerName, score);
        }
      }
    }, 20);
  }

  function gameOver(name, finalScore) {
    isPlaying = false;
    isSaving = true;
    clearInterval(gameInterval);
    dino.classList.remove('dino-running');
    
    document.getElementById('modalScoreVal').innerText = finalScore.toLocaleString();
    document.getElementById('modal-sync-text').innerText = "กำลังเซฟสถิติลง Sheet...";
    gameOverModal.style.display = 'flex';
    syncStatus.innerText = "กำลังอัปเดต...";

    const payload = { action: 'save', name: name, score: finalScore };
    
    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload),
      headers: { "Content-Type": "text/plain;charset=utf-8" }
    })
    .then(res => res.json())
    .then(response => {
      isSaving = false;
      if (response && response.status === "success") {
        renderTable(response.data);
        document.getElementById('modal-sync-text').innerHTML = "✅ เซฟลงชีตเรียบร้อย!";
        syncStatus.innerText = "อัปเดตแล้ว";
      } else throw new Error("Sync failed");
    })
    .catch(err => {
      isSaving = false;
      document.getElementById('modal-sync-text').innerHTML = "⚠️ เน็ตหลุด เซฟไม่ติด";
      syncStatus.innerText = "ออฟไลน์";
    });
  }

  function restartFromModal() {
    if(isSaving) return;
    gameOverModal.style.display = 'none';
    startGame();
  }

  function quitToNameSetup() {
    gameOverModal.style.display = 'none';
    gameStatus.style.display = 'flex';
    statusText.innerHTML = "🔒 ลงชื่อและเลือกโหมดด้านบนก่อนลุย!";
    
    isNameConfirmed = false;
    pNameInput.disabled = false;
    gameModeSelect.disabled = false;
    pNameInput.value = "";
    btnStart.disabled = false;
    btnStart.innerText = "ยืนยันข้อมูล";
    document.getElementById('setup-zone').style.opacity = "1";
    document.getElementById('btn-file-label').innerText = "📸 ใส่รูปโปรไฟล์";
    document.getElementById('btn-file-label').style.borderColor = "";
    document.getElementById('btn-file-label').style.color = "";
    playerImageBase64 = "";
    dino.style.backgroundImage = "url('image_3e4e5d.png')"; 
  }

  function updateLeaderboard() {
    syncStatus.innerText = "กำลังโหลดข้อมูล...";
    fetch(API_URL + "?action=get")
      .then(res => res.json())
      .then(response => {
        if (response && response.status === "success") {
          renderTable(response.data);
          syncStatus.innerText = "อัปเดตล่าสุด";
        }
      }).catch(err => { syncStatus.innerText = "คลาวด์ขัดข้อง"; });
  }

  function renderTable(data) {
    const body = document.getElementById('lbBody');
    if(!data || data.length === 0) {
      body.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">ยังไม่มีใครทำคะแนน</td></tr>`;
      return;
    }
    body.innerHTML = data.map((row, i) => {
      let rankClass = (i < 3) ? 'rank top3' : 'rank';
      let rankText = (i === 0) ? '🥇' : (i === 1) ? '🥈' : (i === 2) ? '🥉' : `#${i+1}`;
      
      let imgData = row[3] && row[3].length > 100 ? row[3] : 'image_3e4e5d.png';
      let imgStyle = imgData === 'image_3e4e5d.png' ? 'opacity: 0.3;' : '';
      
      return `
        <tr>
          <td class="${rankClass}">${rankText}</td>
          <td>
            <div class="player-profile">
              <img src="${imgData}" class="player-avatar" style="${imgStyle}">
              <span style="color:var(--text-main); font-weight:${i < 3 ? 'bold' : 'normal'}">${row[0]}</span>
            </div>
          </td>
          <td class="score-val">${Number(row[1]).toLocaleString()}</td>
        </tr>
      `;
    }).join('');
  }
</script>
</body>
</html>
